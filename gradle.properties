modrinth_project_id=2cJG8mMz
curseforge_project_id=990523
mod_description=13 new weapon types, plus shields, bows, crossbows and shurikens, in every material from wood to netherite.\\n\\nBroadswords, spears, daggers, scythes, rapiers, sickles, katanas, battleaxes, glaives, hammers, claymores, chakrams and sais. Materials from many other mods are supported, and addons like Extended Weaponry can add their own.\\n\\nNew enchantments: Vampirism, Execution, Bleeding and Returning.\\n\\nStats, reach and gear rules are JSON files in config/better_weaponry/, and data packs can change them too.\\n\\nInstall Combat Reforged for combos, parries, dashes, dual wielding and two-handed weapons. Better Combat and Epic Fight also recognize every weapon.
