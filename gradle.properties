# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment : noms de paramètres lisibles dans le code du jeu (https://parchmentmc.org/docs/getting-started)
parchment_minecraft=1.21.1
parchment_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
java_version=21
# Version du jeu sans chargeur, utilisée pour compiler common/
neo_form_version=1.21.1-20240808.144430
mixinextras_version=0.5.0
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.220
neo_version_range=[21.1.220,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)

## Optional integrations (compile only)
jei_version=19.39.0.372
emi_version=1.1.24+1.21.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=better_weaponry
mod_name=Better Weaponry
mod_license=All Rights Reserved
mod_version=2.0.0
mod_group_id=com.betterweaponry
mod_authors=WoroxIV
mod_display_url=https://modrinth.com/mod/better-weaponry
mod_issue_tracker_url=https://github.com/WoroxIV/better-weaponry/issues
mod_description=13 new weapon types, shields, bows, crossbows and shurikens in every material, with combos, parries, dashes, dual wielding, new enchantments, an in-game editor and animated tutorials. Compatible with Better Combat and Epic Fight.
