plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('accesstransformer.cfg'))
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

sourceSets.main.resources {
    // Fichiers générés par :neoforge:runData (modèles, traductions, tags, recettes...).
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    // Plugins d'information de JEI et d'EMI : ces mods restent optionnels pour les joueurs.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}:api"
}

// Ce que les chargeurs récupèrent : les sources Java et les ressources, compilées et empaquetées chez eux.
configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources file('src/main/resources')
    commonResources file('src/generated/resources')
}
