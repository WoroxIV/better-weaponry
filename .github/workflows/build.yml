name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Le mod se compile en Java 17 pour Forge 1.20.1 ; Gradle doit tourner en Java 25 pour l'outil de build de Fabric (le dernier listé est celui par défaut).
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run the GameTests
        run: ./gradlew runGameTestServer

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: better-weaponry
          path: '*/build/libs/*+*.jar'
