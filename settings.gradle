pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'better-weaponry'

// common : code et ressources partagés (compilés contre le jeu vanilla). Un dossier par chargeur pour le reste.
include 'common'
include 'neoforge'
include 'fabric'

